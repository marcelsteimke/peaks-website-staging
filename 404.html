    <link rel="icon" type="image/png" href="assets/peaks-no-text-circle.png">

    <style>
        :root {
            --paper: #F3EFE4;
            --navy: #12294A;
            --text: #3A362F;
            --sign: #FFD200;
            --teal: #0B6F7F;
            --line: rgba(18, 41, 74, .16);
            --cond: 'IBM Plex Sans Condensed', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: var(--paper); color: var(--text);
            font: 400 16px/1.6 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        header { border-bottom: 1px solid var(--line); }
        header nav { max-width: 1480px; margin: 0 auto; height: 64px; display: flex; align-items: center; padding: 0 28px; }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--navy); font-weight: 800; font-size: 21px; letter-spacing: .05em; }
        .brand img { height: 26px; width: auto; }
        main { flex: 1; display: grid; place-items: center; padding: 40px 16px 72px; }
        .card { max-width: 520px; padding: 30px 30px 32px; border: 1.5px solid var(--navy); box-shadow: 6px 6px 0 rgba(18, 41, 74, .14); }
        .card svg { display: block; margin-bottom: 20px; }
        .kicker { display: flex; align-items: center; gap: 12px; font: 600 12px var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--teal); margin-bottom: 14px; }
        .kicker::after { content: ''; width: 64px; border-top: 2px dashed var(--teal); }
        h1 { font-weight: 800; font-size: clamp(28px, 6vw, 38px); line-height: 1.05; letter-spacing: -.02em; color: var(--navy); margin-bottom: 14px; }
        /* the yellow Swiss hiking signpost from the main page */
        .sign { display: inline-flex; margin-top: 24px; text-decoration: none; color: #111; background: var(--sign);
            padding: 10px 36px 10px 15px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
            font-weight: 800; font-size: 15.5px; line-height: 1.25; transition: transform .15s; }
        .sign:hover { transform: translateX(3px); }
        .sign:focus-visible { outline: none; background: var(--navy); color: var(--sign); }
        @media (max-width: 720px) {
            header nav { padding: 0 16px; }
            .card { padding: 22px 18px 24px; }
        }
    </style>
</head>
